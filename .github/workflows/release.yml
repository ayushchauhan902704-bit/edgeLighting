name: 🚀 Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Get Release Tag
      id: tag
      run: |
        if [ "${{ github.event.inputs.tag }}" != "" ]; then
          echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "TAG=v1.0.0" >> $GITHUB_OUTPUT
        fi

    - name: Rename APKs
      run: |
        cp app/build/outputs/apk/release/app-release-unsigned.apk edge-lighting-${{ steps.tag.outputs.TAG }}-release.apk || cp app/build/outputs/apk/release/app-release.apk edge-lighting-${{ steps.tag.outputs.TAG }}-release.apk
        cp app/build/outputs/apk/debug/app-debug.apk edge-lighting-${{ steps.tag.outputs.TAG }}-debug.apk
        
    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: edge-lighting-${{ steps.tag.outputs.TAG }}
        path: |
          edge-lighting-${{ steps.tag.outputs.TAG }}-release.apk
          edge-lighting-${{ steps.tag.outputs.TAG }}-debug.apk
        retention-days: 90
